# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the Next.js API. The React client is served separately from GitHub
# Pages, and the database is a Supabase project.
services:
  - type: web
    name: horizon-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/server/Dockerfile
    # Build from the repository root: npm workspaces put the lockfile there.
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Marked sync:false so Render prompts for them rather than storing
      # secrets in this file.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Optional. Without it the site is browsable from the seeded demo packs
      # and generating a new pack fails with a clear message.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Shared secret for /api/jobs/run and /api/alerts/send.
      - key: WORKER_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      # This host keeps the process alive between requests, so a queued job can
      # start immediately instead of waiting for the next scheduled drain.
      - key: INLINE_WORKER
        value: "true"
